<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="15">
<title>Listzy — Something went wrong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #241a38 0%, #3c2d5a 45%, #2f1d47 100%);
    color: #fff;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .35;
    animation: drift 12s ease-in-out infinite alternate;
  }
  .blob.a { width: 340px; height: 340px; background: #8b5cf6; top: -80px; left: -60px; }
  .blob.b { width: 280px; height: 280px; background: #d946ef; bottom: -60px; right: -40px; animation-delay: -6s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.15); }
  }
  .card {
    position: relative;
    text-align: center;
    padding: 48px 40px;
    max-width: 420px;
    width: calc(100% - 32px);
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 24px;
    backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }
  .cart {
    font-size: 56px;
    display: inline-block;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-12px) rotate(3deg); }
  }
  h1 { font-size: 26px; font-weight: 800; margin: 18px 0 8px; letter-spacing: -.02em; }
  p.sub { font-size: 15px; line-height: 1.55; color: rgba(255, 255, 255, .75); }
  .code {
    display: inline-block;
    margin-top: 14px;
    padding: 5px 14px;
    border-radius: 8px;
    background: rgba(0, 0, 0, .3);
    border: 1px solid rgba(255, 255, 255, .15);
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: #e9d5ff;
  }
  .bar {
    margin: 26px auto 8px;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .14);
    overflow: hidden;
  }
  .bar::after {
    content: '';
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, #c084fc, #f0abfc);
    animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(280%); }
  }
  .timer { font-size: 12px; color: rgba(255, 255, 255, .5); margin-top: 10px; }
  .retry {
    margin-top: 22px;
    display: inline-block;
    padding: 11px 28px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    color: #3c2d5a;
    background: #fff;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
  }
  .retry:hover  { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.3); }
  .retry:active { transform: translateY(0); }
  .foot { margin-top: 26px; font-size: 11px; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="card">
    <span class="cart">🛠️</span>
    <h1>Something went wrong</h1>
    <p class="sub">Listzy hit an unexpected error on our side.<br>
    The admin has been notified and is working on it.</p>
    <div class="code" id="code">Unexpected error</div>
    <div class="bar"></div>
    <div class="timer">Retrying automatically in <b id="secs">15</b>s…</div>
    <button class="retry" onclick="window.location.href='/'">Try again now</button>
    <div class="foot">shop.cloudmc.online</div>
  </div>
<script>
  // error code comes in via ?code=502 (the service worker redirects here)
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var NAMES = { '500': 'Internal server error', '502': 'Bad gateway', '503': 'Service unavailable', '504': 'Gateway timeout', '404': 'Page not found', '403': 'Forbidden' };
  if (code) {
    document.getElementById('code').textContent =
      'Error ' + code + (NAMES[code] ? ' — ' + NAMES[code] : '');
    document.title = 'Listzy — Error ' + code;
  }

  // countdown then retry the real app; meta refresh above is the no-JS fallback
  var s = 15, el = document.getElementById('secs');
  var t = setInterval(function () {
    s -= 1;
    if (s <= 0) { clearInterval(t); window.location.href = '/'; return; }
    el.textContent = s;
  }, 1000);
</script>
</body>
</html>

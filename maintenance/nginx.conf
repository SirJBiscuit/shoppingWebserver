server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index updating.html;

    # Every path serves the updating page — the page auto-reloads the SAME
    # url, so when the real app takes the port back the user lands exactly
    # where they were. No-cache so nothing pins the placeholder.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Marks responses as the placeholder — the service worker shows it to
        # users but must never store it as the app shell.
        add_header X-Listzy-Maintenance "1" always;
        try_files $uri /updating.html;
    }
}

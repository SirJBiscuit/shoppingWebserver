<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="15">
<title>Listzy — Updating</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #4c1d95 100%);
    color: #fff;
    overflow: hidden;
  }
  /* soft floating blobs so it doesn't feel flat */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .35;
    animation: drift 12s ease-in-out infinite alternate;
  }
  .blob.a { width: 340px; height: 340px; background: #6366f1; top: -80px; left: -60px; }
  .blob.b { width: 280px; height: 280px; background: #a855f7; bottom: -60px; right: -40px; animation-delay: -6s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.15); }
  }
  .card {
    position: relative;
    text-align: center;
    padding: 48px 40px;
    max-width: 420px;
    width: calc(100% - 32px);
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 24px;
    backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }
  .cart {
    font-size: 56px;
    display: inline-block;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-12px) rotate(3deg); }
  }
  h1 { font-size: 26px; font-weight: 800; margin: 18px 0 8px; letter-spacing: -.02em; }
  p.sub { font-size: 15px; line-height: 1.55; color: rgba(255, 255, 255, .75); }
  /* animated progress bar */
  .bar {
    margin: 26px auto 8px;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .14);
    overflow: hidden;
  }
  .bar::after {
    content: '';
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, #818cf8, #c084fc);
    animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(280%); }
  }
  .timer { font-size: 12px; color: rgba(255, 255, 255, .5); margin-top: 10px; }
  /* what's in this update — populated from changes.txt written by update-server.sh */
  .changes {
    display: none;
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .12);
    text-align: left;
  }
  .changes h2 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.55); margin-bottom: 7px; }
  .changes ul { list-style: none; }
  .changes li {
    font-size: 12.5px;
    color: rgba(255, 255, 255, .82);
    padding: 3px 0 3px 16px;
    position: relative;
    line-height: 1.4;
  }
  .changes li::before { content: '•'; position: absolute; left: 4px; color: #a5b4fc; }
  .retry {
    margin-top: 22px;
    display: inline-block;
    padding: 11px 28px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    color: #312e81;
    background: #fff;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
  }
  .retry:hover  { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.3); }
  .retry:active { transform: translateY(0); }
  .foot { margin-top: 26px; font-size: 11px; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="card">
    <span class="cart">🛒</span>
    <h1>Listzy is updating</h1>
    <p class="sub">We're rolling out something new.<br>
    Please be patient — the app will be back up within minutes.</p>
    <div class="bar"></div>
    <div class="changes" id="changes"><h2>In this update</h2><ul id="changeList"></ul></div>
    <div class="timer">Retrying automatically in <b id="secs">15</b>s…</div>
    <button class="retry" onclick="window.location.reload()">Check now</button>
    <div class="foot">shop.cloudmc.online</div>
  </div>
<script>
  // countdown + reload; meta refresh above is the no-JS fallback
  var s = 15, el = document.getElementById('secs');
  var t = setInterval(function () {
    s -= 1;
    if (s <= 0) { clearInterval(t); window.location.reload(); return; }
    el.textContent = s;
  }, 1000);

  // Show what's being deployed — update-server.sh writes changes.txt with
  // the commits in this update before swapping this page in.
  fetch('/changes.txt', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (text) {
      if (!text) return;
      var lines = text.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
      if (!lines.length) return;
      var ul = document.getElementById('changeList');
      lines.slice(0, 8).forEach(function (l) {
        var li = document.createElement('li');
        li.textContent = l;
        ul.appendChild(li);
      });
      document.getElementById('changes').style.display = 'block';
    })
    .catch(function () { /* no file — page still works without the list */ });
</script>
</body>
</html>
